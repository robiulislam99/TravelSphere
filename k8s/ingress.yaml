apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelsphere
  namespace: travelsphere
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod   # remove if not using cert-manager
spec:
  ingressClassName: nginx  # or "traefik" if using k3s default
  rules:
    - host: travelsphere.example.com   # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: travelsphere
                port:
                  number: 80
  tls:
    - hosts:
        - travelsphere.example.com
      secretName: travelsphere-tls