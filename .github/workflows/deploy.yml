name: Build and Deploy TravelSphere

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/travelsphere   # lowercase only

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted   # <-- runner installed on your VM (see setup below)
    env:
      KUBECONFIG: $HOME/.kube/config
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          # Keep existing kubeconfig if it already reaches the cluster.
          if kubectl get nodes --request-timeout=5s >/dev/null 2>&1; then
            echo "Existing kubeconfig is valid — keeping it."
          elif [ -n "$KUBE_CONFIG" ]; then
            mkdir -p $HOME/.kube
            # Support both base64-encoded and raw kubeconfig content
            if echo "$KUBE_CONFIG" | base64 -d > /tmp/kubecheck 2>/dev/null && grep -q "apiVersion" /tmp/kubecheck; then
              mv /tmp/kubecheck $HOME/.kube/config
            else
              echo "$KUBE_CONFIG" > $HOME/.kube/config
            fi
            chmod 600 $HOME/.kube/config
          else
            echo "No working kubeconfig or KUBE_CONFIG secret." && exit 1
          fi

      - name: Verify cluster access
        run: |
          mkdir -p $HOME/.kube
          chmod 600 $HOME/.kube/config 2>/dev/null || true
          kubectl get nodes

      - name: Apply namespace and manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.yaml
          # kubectl apply -f k8s/ingress.yaml   # uncomment once domain/ingress controller is set up

      - name: Update image and roll out
        run: |
          kubectl set image deployment/travelsphere \
            travelsphere=${{ needs.build-and-push.outputs.image_tag }} \
            -n travelsphere
          kubectl rollout status deployment/travelsphere -n travelsphere --timeout=120s